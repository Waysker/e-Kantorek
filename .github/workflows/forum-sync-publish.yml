name: Forum Sync Publish

on:
  workflow_dispatch:
  schedule:
    # GitHub drops/delays scheduled runs heavily (observed: one run per ~8-10h
    # instead of hourly). Register several staggered, off-peak triggers; the
    # "Skip if snapshot is fresh" step below keeps redundant runs cheap.
    - cron: "11 * * * *"
    - cron: "31 * * * *"
    - cron: "51 * * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: forum-sync-publish
  cancel-in-progress: false

jobs:
  sync-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - name: Skip if snapshot is fresh
        id: gate
        if: github.event_name == 'schedule'
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORAGH_SNAPSHOT_KEY: ${{ vars.ORAGH_SNAPSHOT_KEY || 'forum' }}
          MIN_INTERVAL_MINUTES: "45"
        run: |
          skip=false
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            response="$(curl --silent --fail --max-time 20 --get "${SUPABASE_URL%/}/rest/v1/forum_snapshot_cache" \
              --data-urlencode "select=updated_at" \
              --data-urlencode "snapshot_key=eq.${ORAGH_SNAPSHOT_KEY}" \
              --data-urlencode "limit=1" \
              -H "apikey: $SUPABASE_SECRET_KEY" \
              -H "Authorization: Bearer $SUPABASE_SECRET_KEY" || true)"
            updated_at="$(echo "$response" | jq -r '.[0].updated_at // empty' 2>/dev/null || true)"
            if [ -n "$updated_at" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$updated_at" +%s) ))
              echo "Snapshot age: ${age}s"
              if [ "$age" -lt $((MIN_INTERVAL_MINUTES * 60)) ]; then
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Validate required secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          ORAGH_FORUM_USERNAME: ${{ secrets.ORAGH_FORUM_USERNAME }}
          ORAGH_FORUM_PASSWORD: ${{ secrets.ORAGH_FORUM_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for key in ORAGH_FORUM_USERNAME ORAGH_FORUM_PASSWORD SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing in repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Sync forum and publish snapshot
        if: steps.gate.outputs.skip != 'true'
        env:
          ORAGH_FORUM_USERNAME: ${{ secrets.ORAGH_FORUM_USERNAME }}
          ORAGH_FORUM_PASSWORD: ${{ secrets.ORAGH_FORUM_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORAGH_SNAPSHOT_KEY: ${{ vars.ORAGH_SNAPSHOT_KEY || 'forum' }}
          ORAGH_INSTRUMENT_OVERRIDES_KEY: ${{ vars.ORAGH_INSTRUMENT_OVERRIDES_KEY || vars.ORAGH_SNAPSHOT_KEY || 'forum' }}
          FORUM_SYNC_PROFILE_CONCURRENCY: "2"
        run: |
          max_attempts=4
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if npm run forum:sync:publish; then
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Forum sync publish failed after $attempt attempts."
              exit 1
            fi
            case "$attempt" in
              1) sleep_seconds=60 ;;
              2) sleep_seconds=180 ;;
              *) sleep_seconds=480 ;;
            esac
            echo "::warning::Forum sync publish failed (attempt $attempt/$max_attempts). Retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
