<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>ORAGH</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="./favicon.ico" />
<script>
  (() => {
    const buildId = "ec379e949cf6db290e44b5ff40d78bfdbeb8a762";
    const url = new URL("./version.json", window.location.href);
    url.searchParams.set("check", String(Date.now()));

    fetch(url, { cache: "no-store", credentials: "omit" })
      .then((response) => (response.ok ? response.json() : null))
      .then((version) => {
        const latestBuildId = version?.buildId;
        if (!latestBuildId || latestBuildId === buildId) {
          const currentUrl = new URL(window.location.href);
          if (currentUrl.searchParams.has("__oragh_build")) {
            currentUrl.searchParams.delete("__oragh_build");
            window.history.replaceState(null, "", currentUrl);
          }
          return;
        }

        const currentUrl = new URL(window.location.href);
        if (currentUrl.searchParams.get("__oragh_build") === latestBuildId) return;
        currentUrl.searchParams.set("__oragh_build", latestBuildId);
        window.location.replace(currentUrl.href);
      })
      .catch(() => {});
  })();
</script>
</head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="./_expo/static/js/web/index-6c3319f8970d41b1d4a9aec15912edc0.js" defer></script>
</body>
</html>
